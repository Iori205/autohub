# Optional local PostgreSQL instead of Supabase.
#   docker compose up -d
# then point DATABASE_URL and DIRECT_URL in .env at it (see .env.example).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub
      POSTGRES_DB: autohub
    ports:
      - "5432:5432"
    volumes:
      - autohub-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohub -d autohub"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autohub-pg:
